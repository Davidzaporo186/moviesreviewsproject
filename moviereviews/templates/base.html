<!doctype html>
<html lang="es">
<head>
    {% load static %}
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Movies Reviews</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom mb-4">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="{% url 'home' %}">
      <img src="{% static 'images/home.png' %}" alt="Inicio" width="30" height="30" class="d-inline-block align-text-top me-1">
      Movies
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Abrir menú">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" href="{% url 'news' %}">News</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'statistics' %}">Statistics</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'about' %}">About</a></li>
      </ul>
    </div>
  </div>
</nav>

<main class="container pb-4">
{% block content %}{% endblock content %}
</main>

<footer class="text-center text-lg-start bg-light text-muted mt-4">
  <div class="container"><div class="row"><div class="text-center p-4">
    <h6>© 2026 Movies Reviews - Taller 2</h6>
  </div></div></div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
