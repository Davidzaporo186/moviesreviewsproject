{% extends 'base.html' %}
{% load static %}
{% block content %}
<h1 class="mb-4">Movie News</h1>
{% for news in newss %}
<div class="card mb-4 shadow-sm overflow-hidden news-card">
  <div class="row g-0 align-items-stretch">
    <div class="col-12 col-md-4">
      <img src="{% static 'images/news.png' %}" class="img-fluid h-100 w-100 news-card-image" alt="Imagen estática de noticias de cine">
    </div>
    <div class="col-12 col-md-8">
      <div class="card-body h-100 d-flex flex-column justify-content-center">
        <h5 class="card-title">{{ news.headline }}</h5>
        <p class="card-text">{{ news.body }}</p>
        <p class="card-text mb-0"><small class="text-muted">{{ news.date }}</small></p>
      </div>
    </div>
  </div>
</div>
{% empty %}
<div class="alert alert-warning">No hay noticias cargadas.</div>
{% endfor %}
{% endblock content %}
